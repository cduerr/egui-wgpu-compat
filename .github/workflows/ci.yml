name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, check, test, and Clippy
    runs-on: ubuntu-latest
    env:
      EGUI_WGPU_TEST_BACKEND: vulkan
      EGUI_WGPU_TEST_FORCE_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update
      - run: sudo apt-get install --yes mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --all-features
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

  backend-smoke:
    name: GPU smoke (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: vulkan
            force_fallback: "1"
          - os: windows-latest
            backend: dx12
            force_fallback: "1"
          - os: macos-latest
            backend: metal
            force_fallback: "0"
    runs-on: ${{ matrix.os }}
    env:
      EGUI_WGPU_TEST_BACKEND: ${{ matrix.backend }}
      EGUI_WGPU_TEST_FORCE_FALLBACK: ${{ matrix.force_fallback }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update
      - if: runner.os == 'Linux'
        run: sudo apt-get install --yes mesa-vulkan-drivers
      - run: cargo test --features gpu-tests --test renderer backend_smoke -- --exact --nocapture

  release:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-targets --all-features

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --lib
